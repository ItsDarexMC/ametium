<style>
:root{--bg:#080808;--surface:#111;--border:rgba(255,255,255,.08);--muted:rgba(255,255,255,.5);--brand:#5a0096;--font:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:64px;-webkit-text-size-adjust:100%}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:#5a0096;font-family:var(--font);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none}
button{font-family:inherit}
img{display:block}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,to{transform:translateY(0)}50%{transform:translateY(-10px)}}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.page{position:relative;z-index:1}
.navbar{display:none;position:fixed;top:0;left:0;right:0;z-index:100;padding:0 1rem;height:64px;align-items:center;justify-content:flex-end;background:rgba(8,8,8,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
.hamburger{display:flex;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px}
.hamburger span{display:block;width:22px;height:2px;background:rgba(255,255,255,.75);border-radius:2px;transition:transform .3s,opacity .3s}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(8,8,8,.98);border-bottom:1px solid rgba(255,255,255,.06);padding:1.25rem 1.5rem 1.5rem;flex-direction:column;gap:.25rem;z-index:99}
.mobile-menu.open{display:flex}
.mobile-menu a{color:rgba(255,255,255,.75);font-size:1rem;font-weight:500;padding:.8rem 0;border-bottom:1px solid rgba(255,255,255,.06);transition:color .2s}
.mobile-menu a:hover{color:#fff}
.mobile-menu .mobile-cta{background:#5a0096;color:#fff;text-align:center;padding:.75rem 1rem;border-radius:8px;font-weight:600;margin-top:.75rem;border:0}
@media(max-width:768px){.navbar{display:flex}}
.icon{width:16px;height:16px;fill:currentColor;flex-shrink:0;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.875rem 2rem;border-radius:10px;font-family:var(--font);font-size:.85rem;font-weight:600;line-height:1.5;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;cursor:pointer;border:2px solid transparent;transition:transform .25s ease,background .2s,border-color .2s,color .2s,box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-main{background:#5a0096;color:#fff}
.btn-main:hover{background:#6c0fb4;box-shadow:0 8px 28px rgba(90,0,150,.45)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.14)}
.btn-ghost:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.05)}
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:6rem 1.5rem 5rem;position:relative;overflow:hidden}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 20%,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 20%,transparent 75%);pointer-events:none}
.hero-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(2rem,5vw,3rem);width:100%;max-width:72rem;text-align:center}
.hero-logo{position:relative;width:clamp(160px,38vw,300px);aspect-ratio:1/1;flex-shrink:0;animation:fadeUp .7s .1s ease both}
.hero-logo:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle,rgba(90,0,150,.5) 0%,transparent 65%);filter:blur(30px);pointer-events:none}
.hero-logo img{position:relative;width:100%;height:100%;object-fit:contain;border-radius:16px}
@media(prefers-reduced-motion:no-preference){.hero-logo img{animation:float 6s ease-in-out infinite}}
.hero-text{display:flex;flex-direction:column;align-items:center}
.hero-title{font-size:clamp(2.5rem,1.2rem + 5vw,4.75rem);font-weight:700;line-height:1.1;letter-spacing:-.03em;text-wrap:balance;animation:fadeUp .7s .2s ease both}
.hero-title span{display:block}
.word-main{color:#5a0096;text-shadow:0 0 28px rgba(90,0,150,.65)}
.word-sub{color:#fff}
.hero-sub{margin-top:1.25rem;max-width:32rem;font-size:.95rem;line-height:1.7;color:#a1a1aa;text-wrap:pretty;animation:fadeUp .7s .3s ease both}
@media(min-width:640px){.hero-sub{font-size:1.05rem}}
.hero-buttons{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-top:2rem;animation:fadeUp .7s .4s ease both}
@media(max-width:480px){.hero-buttons{flex-direction:column;width:100%;max-width:20rem}.hero-buttons .btn{width:100%}}
@media(min-width:1024px){.hero-inner{flex-direction:row;justify-content:space-between;gap:4rem;text-align:left}.hero-text{order:1;align-items:flex-start;flex:1 1 auto;max-width:36rem}.hero-buttons{justify-content:flex-start}.hero-logo{order:2;width:clamp(260px,26vw,340px)}}
.footer{position:relative;border-top:1px solid rgba(255,255,255,.08);background:var(--bg);padding:4rem 2rem 2rem;font-family:var(--font)}
.footer-inner{max-width:1100px;margin:0 auto}
.footer-bottom{border-top:1px solid rgba(255,255,255,.06);padding-top:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.footer-copy{font-size:.78rem;color:rgba(255,255,255,.2)}
.footer-copy span{color:inherit}
.footer-legal{display:flex;gap:1.5rem}
.footer-legal a{font-size:.78rem;color:rgba(255,255,255,.2);transition:color .2s}
.footer-legal a:hover{color:rgba(255,255,255,.5)}
@media(max-width:480px){.footer-bottom{flex-direction:column;align-items:flex-start}}
.discord-card{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:2rem;margin-bottom:1rem;background:rgba(8,8,8,.85);border:1px solid rgba(255,255,255,.06);border-radius:16px}
.discord-info{display:flex;align-items:center;gap:1.25rem;min-width:0}
.discord-info img{width:72px;height:72px;border-radius:12px;flex-shrink:0;border:0;object-fit:cover}
.discord-text{min-width:0}
.discord-text h2{color:#fff;font-family:inherit;font-size:20px;font-weight:600;line-height:1.3}
.discord-stats{display:flex;flex-wrap:wrap;gap:4px 15px;margin-top:8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.discord-stats>span{display:inline-flex;align-items:center;gap:6px}
.stat-dot{width:6px;height:6px;border-radius:50%;background:#777}
.stat-dot.online{background:#9ee6b3}
.discord-card .btn-main,.team-card .btn-main{font-size:.95rem;font-weight:600;letter-spacing:normal;text-transform:none;padding:.85rem 2rem;border-radius:8px;flex-shrink:0}
.discord-card .btn-main{background:#4752c4}
.team-card .btn-main{background:#b00000}
.discord-card .btn-main:hover{background:#4752c4;box-shadow:none}
.team-card .btn-main:hover{background:#b00000;box-shadow:none}
.team{padding:0 0 4rem;text-align:center}
.team-card{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:2rem;background:rgba(8,8,8,.85);border:1px solid rgba(255,255,255,.06);border-radius:16px}
.team-info{display:flex;align-items:center;gap:1.25rem;min-width:0}
.team-info img{width:72px;height:72px;border-radius:12px;flex-shrink:0;border:0;object-fit:cover}
.team-text{min-width:0;text-align:left}
.team-name{color:#fff;font-family:inherit;font-size:20px;font-weight:600;line-height:1.3}
.team-role{margin-top:8px;color:var(--muted);font-size:14px}
@media(max-width:600px){
.footer{padding:3rem 1rem 2rem}
.footer-bottom{flex-direction:column;align-items:center;text-align:center}
.footer-legal{justify-content:center}
.discord-card{flex-direction:column;align-items:center;text-align:center;gap:1.25rem;padding:1.5rem}
.discord-info{flex-direction:column;gap:.9rem;width:100%}
.discord-info img{width:60px;height:60px}
.discord-text{text-align:center}
.discord-stats{justify-content:center}
.discord-card .btn-main{width:100%;max-width:280px;align-self:center}
.team{padding:0 0 3rem}
.team-card{flex-direction:column;align-items:center;text-align:center;gap:1.25rem;padding:1.5rem}
.team-info{flex-direction:column;gap:.9rem;width:100%}
.team-info img{width:60px;height:60px}
.team-text{text-align:center}
.team-card .btn-main{width:100%;max-width:280px;align-self:center}
}
</style>
</head>

<script>
(function(){
var burger=document.getElementById('hamburger');
var menu=document.getElementById('mobile-menu');
burger.addEventListener('click',function(){
var open=menu.classList.toggle('open');
burger.classList.toggle('open',open);
burger.setAttribute('aria-expanded',open?'true':'false');
});
menu.querySelectorAll('a').forEach(function(a){
a.addEventListener('click',function(){
menu.classList.remove('open');burger.classList.remove('open');burger.setAttribute('aria-expanded','false');
});
});
var total=document.getElementById('total-members');
var online=document.getElementById('online-members');
function fmt(n){return Number.isFinite(n)?n.toLocaleString('en-US'):'0'}
function updateStats(){
if(document.hidden)return;
var ctrl=new AbortController();
var timer=setTimeout(function(){ctrl.abort()},8000);
fetch('https://discord.com/api/v9/invites/ametium?with_counts=true',{signal:ctrl.signal})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
.then(function(d){total.textContent=fmt(d.approximate_member_count);online.textContent=fmt(d.approximate_presence_count)})
.catch(function(){if(total.textContent==='…')total.textContent='0';if(online.textContent==='…')online.textContent='0'})
.finally(function(){clearTimeout(timer)});
}
updateStats();
setInterval(updateStats,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)updateStats()});
var canvas=document.getElementById('stars');
var ctx=canvas.getContext('2d');
var stars=[];
var lastW=0;
function resize(){
var w=window.innerWidth,h=window.innerHeight;
if(w===lastW&&stars.length){
if(h>canvas.height)canvas.height=h;
return;
}
lastW=w;
canvas.width=w;
canvas.height=h;
var n=Math.floor(w*h/(w<=600?7000:16000));
stars=[];
for(var i=0;i<n;i++){
stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.1+.2,a:Math.random()*.5+.15,s:Math.random()*.02+.004,d:Math.random()*Math.PI*2,v:Math.random()*.3+.08});
}
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(var i=0;i<stars.length;i++){
var s=stars[i];
s.d+=s.s;
s.y-=s.v;
if(s.y<-2){s.y=canvas.height+2;s.x=Math.random()*canvas.width}
var o=s.a*(.6+.4*Math.sin(s.d));
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fillStyle='rgba(255,255,255,'+o.toFixed(3)+')';
ctx.fill();
}
requestAnimationFrame(draw);
}
window.addEventListener('resize',resize);
resize();
draw();
})();
</script>
