<style>
:root{--bg:#080808;--surface:#111;--border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.18);--accent:#fff;--muted:rgba(255,255,255,.45);--font-display:Arial,Helvetica,sans-serif;--font-body:Arial,Helvetica,sans-serif;--font-nav:Arial,Helvetica,sans-serif}
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:64px}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:#5a0096;font-family:var(--font-body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{text-decoration:none}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,to{opacity:1}50%{opacity:.4}}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.page{position:relative;z-index:1}
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(8,8,8,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--font-nav)}
.nav-logo{font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:#fff;letter-spacing:.05em;display:flex;align-items:center;gap:.5rem}
.nav-logo img{width:28px;height:28px;border-radius:6px;object-fit:contain;flex-shrink:0}

.nav-dot,.footer-logo-dot{width:8px;height:8px;border-radius:50%;background:#fff}
.nav-links{display:flex;align-items:center;gap:2rem;list-style:none}

.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:#fff;transition:width .2s}

.nav-actions{display:flex;align-items:center;gap:4px}

.btn-text:hover{color:#fff}

.nav-logo,.hero-title .word-sub,.hero-sub,.discord-text h2,.discord-stats,.btn-text,.footer-copy,.btn-main,.btn-ghost{text-shadow:0 0 6px color-mix(in srgb,currentColor 25%,transparent),0 0 16px color-mix(in srgb,currentColor 25%,transparent)}

@media(max-width:600px){.features-section{padding:4rem 1rem}.category-panel{padding:1.75rem 1rem 1.25rem}.category-header{margin-bottom:1.5rem}.category-arrow{top:2.1rem;transform:none;width:32px;height:32px}.category-previous{left:.75rem}.category-next{right:.75rem}.category-header h3{margin-inline:1.75rem;font-size:1.15rem;gap:.4rem}.category-header .category-icon{width:1.25rem;height:1.25rem}.category-header p{font-size:.8rem}.module-grid{grid-template-columns:1fr;height:360px}}
.pricing-section{padding:6rem 2rem;max-width:1100px;margin:0 auto;text-align:center}

<script>
(function(){
var burger=document.getElementById('hamburger');
var menu=document.getElementById('mobile-menu');
burger.addEventListener('click',function(){
var open=menu.classList.toggle('open');
burger.classList.toggle('open',open);
burger.setAttribute('aria-expanded',open?'true':'false');
});
menu.querySelectorAll('a').forEach(function(a){
a.addEventListener('click',function(){
menu.classList.remove('open');burger.classList.remove('open');burger.setAttribute('aria-expanded','false');
});
});
var total=document.getElementById('total-members');
var online=document.getElementById('online-members');
function fmt(n){return Number.isFinite(n)?n.toLocaleString('en-US'):'0'}
function updateStats(){
if(document.hidden)return;
var ctrl=new AbortController();
var timer=setTimeout(function(){ctrl.abort()},8000);
fetch('https://discord.com/api/v9/invites/ametium?with_counts=true',{signal:ctrl.signal})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
.then(function(d){total.textContent=fmt(d.approximate_member_count);online.textContent=fmt(d.approximate_presence_count)})
.catch(function(){if(total.textContent==='…')total.textContent='0';if(online.textContent==='…')online.textContent='0'})
.finally(function(){clearTimeout(timer)});
}
updateStats();
setInterval(updateStats,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)updateStats()});
var canvas=document.getElementById('stars');
var ctx=canvas.getContext('2d');
var stars=[];
var lastW=0;
function resize(){
var w=window.innerWidth,h=window.innerHeight;
if(w===lastW&&stars.length){
if(h>canvas.height)canvas.height=h;
return;
}
lastW=w;
canvas.width=w;
canvas.height=h;
var n=Math.floor(w*h/(w<=600?3500:9000));
stars=[];
for(var i=0;i<n;i++){
stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.2,a:Math.random()*.6+.2,s:Math.random()*.02+.004,d:Math.random()*Math.PI*2,v:Math.random()*.4+.1});
}
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(var i=0;i<stars.length;i++){
var s=stars[i];
s.d+=s.s;
s.y-=s.v;
if(s.y<-2){s.y=canvas.height+2;s.x=Math.random()*canvas.width}
var o=s.a*(.6+.4*Math.sin(s.d));
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fillStyle='rgba(255,255,255,'+o.toFixed(3)+')';
ctx.fill();
}
requestAnimationFrame(draw);
}
window.addEventListener('resize',resize);
resize();
draw();
})();
</script>
